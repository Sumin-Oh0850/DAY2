<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반응형 카테고리</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #f4f5f7; color: #333; line-height: 1.7; }
    header { position: sticky; top: 0; z-index: 10; background: #2b6cb0; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    header h1 { margin: 0; font-size: 1.2rem; padding: 14px 0; }
    #menu-btn { display: none; background: none; border: 0; font-size: 1.8rem; cursor: pointer; }
    nav ul { list-style: none; margin: 0; padding: 0; display: flex; }
    nav button { background: none; border: 0; color: #fff; font-size: 1rem; padding: 16px 16px; cursor: pointer; }
    nav button:hover, nav button.active { background: rgba(255,255,255,.2); }
    main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
    .panel { display: none; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 22px; }
    .panel.active { display: block; }
    .panel h2 { margin-top: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .card { background: #f4f5f7; border-radius: 10px; padding: 14px; text-align: center; }
    .card .emoji { font-size: 2rem; }
    footer { text-align: center; color: #888; font-size: .85rem; padding: 20px; }

    @media (max-width: 700px) {
      #menu-btn { display: block; }
      header { flex-wrap: wrap; }
      nav { width: 100%; display: none; }
      nav.open { display: block; }
      nav ul { flex-direction: column; }
      nav button { width: 100%; text-align: left; border-top: 1px solid rgba(255,255,255,.2); }
    }
  </style>
</head>
<body>
  <header>
    <h1>📂 카테고리</h1>
    <button id="menu-btn" aria-label="메뉴 열기" aria-expanded="false">🍔</button>
    <nav id="nav">
      <ul>
        <li><button data-tab="food" class="active">🍜 음식</button></li>
        <li><button data-tab="furniture">🛋️ 가구</button></li>
        <li><button data-tab="estate">🏠 부동산</button></li>
        <li><button data-tab="stock">📈 주식</button></li>
        <li><button data-tab="map">🗺️ 지도</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="panel active" id="food">
      <h2>🍜 음식</h2>
      <div class="cards">
        <div class="card"><div class="emoji">🍲</div>한식</div>
        <div class="card"><div class="emoji">🍣</div>일식</div>
        <div class="card"><div class="emoji">🍕</div>양식</div>
        <div class="card"><div class="emoji">🍰</div>디저트</div>
      </div>
    </section>

    <section class="panel" id="furniture">
      <h2>🛋️ 가구</h2>
      <div class="cards">
        <div class="card"><div class="emoji">🛏️</div>침대</div>
        <div class="card"><div class="emoji">🪑</div>의자</div>
        <div class="card"><div class="emoji">🛋️</div>소파</div>
        <div class="card"><div class="emoji">🗄️</div>수납장</div>
      </div>
    </section>

    <section class="panel" id="estate">
      <h2>🏠 부동산</h2>
      <div class="cards">
        <div class="card"><div class="emoji">🏢</div>아파트</div>
        <div class="card"><div class="emoji">🏡</div>단독주택</div>
        <div class="card"><div class="emoji">🏬</div>상가</div>
        <div class="card"><div class="emoji">🏗️</div>분양</div>
      </div>
    </section>

    <section class="panel" id="stock">
      <h2>📈 주식</h2>
      <div class="cards">
        <div class="card"><div class="emoji">📊</div>시장 동향</div>
        <div class="card"><div class="emoji">💹</div>관심 종목</div>
        <div class="card"><div class="emoji">📰</div>경제 뉴스</div>
        <div class="card"><div class="emoji">🧾</div>투자 기록</div>
      </div>
    </section>

    <section class="panel" id="map">
      <h2>🗺️ 지도</h2>
      <div class="cards">
        <div class="card"><div class="emoji">📍</div>내 위치</div>
        <div class="card"><div class="emoji">🚇</div>대중교통</div>
        <div class="card"><div class="emoji">🚗</div>길찾기</div>
        <div class="card"><div class="emoji">⭐</div>즐겨찾기</div>
      </div>
    </section>
  </main>

  <footer>샘플 화면입니다. 실제 데이터가 아닙니다.</footer>

  <script>
    const nav = document.getElementById('nav');
    const menuBtn = document.getElementById('menu-btn');
    const tabs = nav.querySelectorAll('button');
    const panels = document.querySelectorAll('.panel');

    menuBtn.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', open);
    });

    tabs.forEach(btn => btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.toggle('active', b === btn));
      panels.forEach(p => p.classList.toggle('active', p.id === btn.dataset.tab));
      nav.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    }));
  </script>
</body>
</html>
