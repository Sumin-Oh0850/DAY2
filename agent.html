<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 특산물 에이전트</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #fff8ee; height: 100vh; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; }
    header { background: #f77f00; color: #fff; padding: 14px; text-align: center; font-weight: bold; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .me { align-self: flex-end; background: #ffd9a0; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #fff; border: 1px solid #eee; border-bottom-left-radius: 4px; }
    form { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid #eee; }
    input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 8px; background: #f77f00; color: #fff; cursor: pointer; }
    .note { text-align: center; font-size: .75rem; color: #999; padding: 6px; background: #fff; }
  </style>
</head>
<body>
  <header>🍊 제주 특산물 에이전트</header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="메시지를 입력하세요" autocomplete="off">
    <button type="submit">보내기</button>
  </form>
  <div class="note">※ 지금 나오는 답은 가짜(미리 정해 둔 문장)입니다.</div>

  <script>
    const replies = [
      '안녕하세요, 오서연 님! 제주도 특산물을 알려 드리는 에이전트예요 🍊 감귤, 흑돼지, 해산물 중 어떤 게 궁금하세요?',
      '제주에 오신다면 한라봉을 추천해요! 향이 진하고 달콤해서 처음 맛보기에 좋아요 🍊',
      '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
    ];
    let turn = 0;
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');

    function add(text, cls) {
      const div = document.createElement('div');
      div.className = 'bubble ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text, 'me');
      input.value = '';
      const reply = replies[turn % replies.length];
      turn++;
      setTimeout(() => add(reply, 'bot'), 1000);
    });
  </script>
</body>
</html>
