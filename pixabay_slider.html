<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixabay 이미지 슬라이더</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    input { flex: 1; padding: 10px; font-size: 1rem; }
    button { padding: 10px 18px; font-size: 1rem; cursor: pointer; }
    #msg { color: #c00; min-height: 1.4em; }
    .slider { position: relative; background: #111; border-radius: 12px; overflow: hidden; display: none; }
    .slider img { width: 100%; height: 420px; object-fit: contain; display: block; }
    .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.5); color: #fff; border: 0; font-size: 1.6rem; }
    #prev { left: 8px; }
    #next { right: 8px; }
    #info { text-align: center; color: #fff; padding: 8px; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Pixabay 이미지 슬라이더</h1>

  <div class="row">
    <input id="key" type="password" placeholder="Pixabay API 키">
  </div>
  <div class="row">
    <input id="q" placeholder="검색어 (예: jeju, orange)">
    <button id="search">검색</button>
  </div>
  <p id="msg"></p>

  <div class="slider" id="slider">
    <img id="img" alt="">
    <button class="nav" id="prev">&#10094;</button>
    <button class="nav" id="next">&#10095;</button>
    <div id="info"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let images = [], idx = 0;

    function show() {
      const h = images[idx];
      $('img').src = h.webformatURL;
      $('img').alt = h.tags;
      $('info').textContent = `${idx + 1} / ${images.length} · ${h.tags} · by ${h.user}`;
    }

    async function search() {
      const key = $('key').value.trim();
      const q = $('q').value.trim();
      $('msg').textContent = '';
      if (!key || !q) { $('msg').textContent = 'API 키와 검색어를 입력하세요.'; return; }

      try {
        const url = `https://pixabay.com/api/?key=${encodeURIComponent(key)}&q=${encodeURIComponent(q)}&image_type=photo&per_page=10`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`요청 실패 (${res.status}). API 키를 확인하세요.`);
        const data = await res.json();
        images = data.hits;
        if (!images.length) { $('slider').style.display = 'none'; $('msg').textContent = '검색 결과가 없습니다.'; return; }
        idx = 0;
        $('slider').style.display = 'block';
        show();
      } catch (e) {
        $('msg').textContent = e.message;
      }
    }

    $('search').addEventListener('click', search);
    $('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    $('prev').addEventListener('click', () => { idx = (idx - 1 + images.length) % images.length; show(); });
    $('next').addEventListener('click', () => { idx = (idx + 1) % images.length; show(); });
  </script>
</body>
</html>
